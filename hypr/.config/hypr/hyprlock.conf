$font = Monospace

general {
    hide_cursor = false
}

animations {
    enabled = false
}
background {
    monitor =
    color = rgb(21252b)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(858a95ff)
    check_color = rgba(555b66ff)
    fail_color = rgba(c66068ff)

    font_color = rgb(858a95)
    fade_on_empty = false
    rounding = 0 

    font_family = $font
    placeholder_text = Enter password
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.4

    position = 0, 50
    halign = center
    valign = center
}
